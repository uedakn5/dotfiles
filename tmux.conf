# Prefix: Ctrl+T (matching screen escape ^Tt)
set -g prefix C-t
unbind C-b
bind C-t send-prefix

# Terminal & display
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g escape-time 10
set -g history-limit 8192
set -g focus-events on

# No bell
set -g bell-action none
set -g visual-bell off
set -g visual-activity off

# SSH_AUTH_SOCK forwarding
set -g update-environment "SSH_AUTH_SOCK"

# Window management
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename on

# Key bindings
bind d   display "detach is disabled"
bind R   source-file ~/.tmux.conf \; display ".tmux.conf reloaded"
bind c   new-window -c "#{pane_current_path}"
bind C-c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind S   split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind w   choose-window
bind Tab select-pane -t :.+
bind x   kill-pane
bind X   kill-window
bind n   next-window
bind C-n next-window
bind p   previous-window
bind C-p previous-window

# Resize mode: prefix+r, then j/k/J/K (like screen's cresize)
bind r switch-client -T resize \; display "Resize Mode..."
bind -T resize j resize-pane -D 1  \; switch-client -T resize
bind -T resize k resize-pane -U 1  \; switch-client -T resize
bind -T resize J resize-pane -D 10 \; switch-client -T resize
bind -T resize K resize-pane -U 10 \; switch-client -T resize
bind -T resize = select-layout even-vertical \; switch-client -T resize
bind -T resize x resize-pane -Z

# Status bar
set -g status on
set -g status-interval 15
set -g status-position bottom
set -g status-style         "fg=white,bg=default"
set -g status-left-length   50
set -g status-right-length  80

set -g status-left  "#[fg=green]#S:#I #[fg=red]#W#[fg=default] @#h "
set -g status-right ""

set -g window-status-format         " #[fg=white]#I #W#F "
set -g window-status-current-format " #[fg=green,bold]#I #W#F "
set -g window-status-separator      ""
